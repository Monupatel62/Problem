name: Problem CI
on:
  push:
    branches: [extract/wohotech-problems]
  pull_request:
    branches: [extract/wohotech-problems]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/problem_ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/problem_ci
      - run: npm run content:validate
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/problem_ci
          NEXTAUTH_SECRET: ci-test-secret
          NEXT_PUBLIC_SITE_URL: https://problem.example.invalid
