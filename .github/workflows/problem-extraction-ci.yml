name: Problem Extraction CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run content:validate
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/problem_test
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/problem_test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/problem_test
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXT_PUBLIC_SITE_URL: https://problem.example.test
