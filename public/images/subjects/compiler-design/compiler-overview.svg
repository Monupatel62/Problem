<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Compiler overview</title>
  <desc id="desc">A source program goes into a compiler and produces a target program, while the compiler also reports error information.</desc>
  <rect width="920" height="460" fill="#ffffff"/>
  <text x="460" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f2f6f">COMPILER - OVERVIEW</text>

  <rect x="42" y="115" width="230" height="210" rx="14" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="157" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f2f6f">Source Program</text>
  <text x="157" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f2f6f">in one language</text>
  <rect x="102" y="215" width="110" height="72" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <line x1="122" y1="239" x2="180" y2="239" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="122" y1="260" x2="190" y2="260" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
  <line x1="122" y1="281" x2="165" y2="281" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>

  <path d="M292 220 H370" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round"/>
  <path d="M370 220 L348 203 V237 Z" fill="#1d4ed8"/>

  <rect x="390" y="160" width="220" height="120" rx="16" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
  <text x="500" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#166534">COMPILER</text>

  <path d="M630 220 H705" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round"/>
  <path d="M705 220 L683 203 V237 Z" fill="#1d4ed8"/>

  <rect x="725" y="115" width="155" height="210" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="802" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#7c2d12">Target</text>
  <text x="802" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#7c2d12">Program</text>
  <rect x="767" y="215" width="72" height="58" rx="6" fill="#111827" stroke="#334155" stroke-width="3"/>
  <rect x="775" y="223" width="56" height="36" fill="#bbf7d0"/>
  <text x="803" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">101010</text>

  <path d="M500 285 V340" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  <path d="M500 340 L482 318 H518 Z" fill="#dc2626"/>
  <rect x="345" y="350" width="310" height="78" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#b91c1c">Error Information</text>
  <text x="500" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">Syntax errors, semantic errors, type mismatch, etc.</text>
</svg>
