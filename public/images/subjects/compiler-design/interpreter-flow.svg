<svg xmlns="http://www.w3.org/2000/svg" width="820" height="190" viewBox="0 0 820 190" role="img" aria-labelledby="title desc">
  <title id="title">Interpreter flow</title>
  <desc id="desc">The source program and input are given to the interpreter, which directly produces output.</desc>
  <rect width="820" height="190" fill="#ffffff"/>
  <text x="110" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Source Program</text>
  <text x="110" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Input</text>
  <path d="M190 50 H310" stroke="#111827" stroke-width="3"/>
  <path d="M310 50 L295 40 V60 Z" fill="#111827"/>
  <path d="M190 104 H310" stroke="#111827" stroke-width="3"/>
  <path d="M310 104 L295 94 V114 Z" fill="#111827"/>
  <rect x="330" y="32" width="190" height="92" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="425" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Interpreter</text>
  <path d="M520 78 H650" stroke="#111827" stroke-width="3"/>
  <path d="M650 78 L635 68 V88 Z" fill="#111827"/>
  <text x="705" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Output</text>
  <text x="410" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Figure: Running with an Interpreter</text>
</svg>
