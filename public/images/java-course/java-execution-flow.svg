  <text x="84" y="104" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="34" font-weight="700">Java Program Execution Flow</text>
  <text x="84" y="142" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">A simple view of how Java becomes platform independent.</text>

