  <text x="425" y="255" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">Compiler</text>
  <text x="425" y="286" text-anchor="middle" fill="#CCFBF1" font-family="Arial, sans-serif" font-size="18">javac</text>

  <rect x="576" y="204" width="190" height="120" rx="18" fill="#7C3AED"/>
