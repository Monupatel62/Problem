  <text x="887" y="246" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">JVM</text>
  <text x="887" y="280" text-anchor="middle" fill="#FCE7F3" font-family="Arial, sans-serif" font-size="16">loads, verifies,</text>
  <text x="887" y="302" text-anchor="middle" fill="#FCE7F3" font-family="Arial, sans-serif" font-size="16">and runs code</text>

