<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#1a1f36"/>
    </linearGradient>
    <linearGradient id="v8Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4"/>
      <stop offset="100%" style="stop-color:#1a73e8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="850" height="500" fill="url(#bg)" rx="14"/>
  
  <text x="425" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">🏎️ JavaScript Engine Architecture (V8)</text>
  <text x="425" y="53" text-anchor="middle" fill="#8892b0" font-size="11">How your JavaScript code gets executed — from source to machine code</text>

  <!-- Source Code Input -->
  <g filter="url(#shadow)">
    <rect x="30" y="75" width="130" height="50" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="95" y="98" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">📝 Source</text>
    <text x="95" y="113" text-anchor="middle" fill="#94a3b8" font-size="9">JavaScript Code</text>
  </g>

  <!-- Arrow -->
  <path d="M160 100 L195 100" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="192,95 202,100 192,105" fill="#64748b"/>

  <!-- Parser / Tokenizer -->
  <g filter="url(#shadow)">
    <rect x="205" y="75" width="140" height="50" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="275" y="98" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">🔤 Parser</text>
    <text x="275" y="113" text-anchor="middle" fill="#94a3b8" font-size="9">Tokenize → AST</text>
  </g>

  <!-- Arrow -->
  <path d="M345 100 L380 100" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="377,95 387,100 377,105" fill="#64748b"/>

  <!-- Interpreter (Ignition) -->
  <g filter="url(#shadow)">
    <rect x="390" y="75" width="160" height="50" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="470" y="98" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">⚡ Ignition</text>
    <text x="470" y="113" text-anchor="middle" fill="#94a3b8" font-size="9">Interpreter → Bytecode</text>
  </g>

  <!-- Arrow -->
  <path d="M550 100 L585 100" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="582,95 592,100 582,105" fill="#64748b"/>

  <!-- Compiler (TurboFan) -->
  <g filter="url(#shadow)">
    <rect x="595" y="75" width="160" height="50" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <text x="675" y="98" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">🚀 TurboFan</text>
    <text x="675" y="113" text-anchor="middle" fill="#94a3b8" font-size="9">JIT Compiler → Machine Code</text>
  </g>

  <!-- Pipeline Detail Section -->
  <g filter="url(#shadow)">
    <rect x="30" y="145" width="790" height="330" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="425" y="172" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Detailed Pipeline</text>
  </g>

  <!-- Step 1: Parsing -->
  <g>
    <rect x="50" y="190" width="230" height="120" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="50" y="190" width="230" height="26" rx="10" fill="#f59e0b"/>
    <text x="165" y="208" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="600">1️⃣ PARSING</text>
    
    <text x="65" y="233" fill="#fbbf24" font-size="10">Lexical Analysis (Tokenizer)</text>
    <text x="65" y="251" fill="#94a3b8" font-size="9">let x = 5; → [let] [x] [=] [5] [;]</text>
    
    <text x="65" y="275" fill="#fbbf24" font-size="10">Syntax Analysis (Parser)</text>
    <text x="65" y="293" fill="#94a3b8" font-size="9">Tokens → Abstract Syntax Tree (AST)</text>
  </g>

  <!-- Step 2: Interpretation -->
  <g>
    <rect x="300" y="190" width="240" height="120" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="300" y="190" width="240" height="26" rx="10" fill="#10b981"/>
    <text x="420" y="208" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">2️⃣ IGNITION (Interpreter)</text>
    
    <text x="315" y="233" fill="#34d399" font-size="10">Converts AST → Bytecode</text>
    <text x="315" y="251" fill="#94a3b8" font-size="9">Fast startup (no optimization)</text>
    <text x="315" y="275" fill="#34d399" font-size="10">Collects profiling data</text>
    <text x="315" y="293" fill="#94a3b8" font-size="9">Tracks "hot" functions (called often)</text>
  </g>

  <!-- Step 3: Compilation -->
  <g>
    <rect x="560" y="190" width="245" height="120" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="560" y="190" width="245" height="26" rx="10" fill="#ef4444"/>
    <text x="682" y="208" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">3️⃣ TURBOFAN (JIT Compiler)</text>
    
    <text x="575" y="233" fill="#fca5a5" font-size="10">Hot code → Optimized Machine Code</text>
    <text x="575" y="251" fill="#94a3b8" font-size="9">Type specialization, inlining</text>
    <text x="575" y="275" fill="#fca5a5" font-size="10">Deoptimization if assumptions fail</text>
    <text x="575" y="293" fill="#94a3b8" font-size="9">Falls back to Ignition bytecode</text>
  </g>

  <!-- Optimization cycle arrow -->
  <path d="M682 310 Q682 340 550 345 Q420 350 420 330" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="555" y="355" fill="#fbbf24" font-size="9">🔄 Deoptimize (bailout)</text>

  <!-- Memory management section -->
  <g>
    <rect x="50" y="340" width="350" height="120" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="225" y="363" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">🧠 Memory Management</text>
    
    <rect x="70" y="375" width="140" height="35" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="140" y="397" text-anchor="middle" fill="#c4b5fd" font-size="10">Stack (Primitives)</text>
    
    <rect x="225" y="375" width="155" height="35" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="302" y="397" text-anchor="middle" fill="#c4b5fd" font-size="10">Heap (Objects/Arrays)</text>
    
    <text x="70" y="432" fill="#94a3b8" font-size="9">🗑️ Garbage Collector:</text>
    <text x="195" y="432" fill="#a78bfa" font-size="9">Mark-Sweep + Generational GC</text>
    <text x="70" y="448" fill="#94a3b8" font-size="9">Minor GC (Young) | Major GC (Old Generation)</text>
  </g>

  <!-- Hidden Classes / Inline Caching -->
  <g>
    <rect x="420" y="370" width="385" height="90" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="612" y="393" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="600">⚡ V8 Optimization Tricks</text>
    
    <text x="440" y="415" fill="#67e8f9" font-size="10">• Hidden Classes — Shape tracking for fast access</text>
    <text x="440" y="435" fill="#67e8f9" font-size="10">• Inline Caching — Remember property locations</text>
    <text x="440" y="455" fill="#67e8f9" font-size="10">• Function Inlining — Embed small functions</text>
  </g>

  <text x="425" y="490" text-anchor="middle" fill="#475569" font-size="9">V8 (Chrome/Node.js) | SpiderMonkey (Firefox) | JavaScriptCore (Safari) — All follow similar pipeline</text>
</svg>