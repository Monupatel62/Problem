<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="850" height="520" fill="url(#bg)" rx="14"/>
  
  <text x="425" y="33" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">🔧 Array Methods — Visual Guide</text>
  <text x="425" y="50" text-anchor="middle" fill="#8892b0" font-size="11">map, filter, reduce, find, forEach — How they transform arrays</text>

  <!-- MAP -->
  <g filter="url(#shadow)">
    <rect x="25" y="65" width="395" height="100" rx="10" fill="#0a192f" stroke="#8b5cf6" stroke-width="2"/>
    <text x="40" y="88" fill="#a78bfa" font-size="12" font-weight="700">.map()</text>
    <text x="110" y="88" fill="#8892b0" font-size="10">— Transform each element → New array (same length)</text>
    
    <!-- Input array -->
    <rect x="40" y="98" width="35" height="25" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="57" y="115" text-anchor="middle" fill="#c4b5fd" font-size="10">1</text>
    <rect x="80" y="98" width="35" height="25" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="97" y="115" text-anchor="middle" fill="#c4b5fd" font-size="10">2</text>
    <rect x="120" y="98" width="35" height="25" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="137" y="115" text-anchor="middle" fill="#c4b5fd" font-size="10">3</text>
    
    <text x="170" y="115" fill="#8b5cf6" font-size="14">→</text>
    <text x="188" y="115" fill="#e2e8f0" font-size="9">x * 2</text>
    <text x="225" y="115" fill="#8b5cf6" font-size="14">→</text>
    
    <!-- Output array -->
    <rect x="245" y="98" width="35" height="25" rx="4" fill="#312e81" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="262" y="115" text-anchor="middle" fill="#e9d5ff" font-size="10">2</text>
    <rect x="285" y="98" width="35" height="25" rx="4" fill="#312e81" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="302" y="115" text-anchor="middle" fill="#e9d5ff" font-size="10">4</text>
    <rect x="325" y="98" width="35" height="25" rx="4" fill="#312e81" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="342" y="115" text-anchor="middle" fill="#e9d5ff" font-size="10">6</text>
    
    <text x="40" y="150" fill="#94a3b8" font-size="9">Returns: New array | Original: Unchanged | Use: Transform data</text>
  </g>

  <!-- FILTER -->
  <g filter="url(#shadow)">
    <rect x="430" y="65" width="395" height="100" rx="10" fill="#0a192f" stroke="#10b981" stroke-width="2"/>
    <text x="445" y="88" fill="#34d399" font-size="12" font-weight="700">.filter()</text>
    <text x="520" y="88" fill="#8892b0" font-size="10">— Keep items matching condition → Shorter array</text>
    
    <!-- Input -->
    <rect x="445" y="98" width="30" height="25" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="460" y="115" text-anchor="middle" fill="#6ee7b7" font-size="10">1</text>
    <rect x="480" y="98" width="30" height="25" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="495" y="115" text-anchor="middle" fill="#6ee7b7" font-size="10">5</text>
    <rect x="515" y="98" width="30" height="25" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="530" y="115" text-anchor="middle" fill="#6ee7b7" font-size="10">2</text>
    <rect x="550" y="98" width="30" height="25" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="565" y="115" text-anchor="middle" fill="#6ee7b7" font-size="10">8</text>
    <rect x="585" y="98" width="30" height="25" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="600" y="115" text-anchor="middle" fill="#6ee7b7" font-size="10">3</text>
    
    <text x="628" y="115" fill="#10b981" font-size="12">→</text>
    <text x="645" y="115" fill="#e2e8f0" font-size="9">x &gt; 3</text>
    <text x="680" y="115" fill="#10b981" font-size="12">→</text>
    
    <!-- Output -->
    <rect x="700" y="98" width="30" height="25" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="715" y="115" text-anchor="middle" fill="#a7f3d0" font-size="10">5</text>
    <rect x="735" y="98" width="30" height="25" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="750" y="115" text-anchor="middle" fill="#a7f3d0" font-size="10">8</text>
    
    <text x="445" y="150" fill="#94a3b8" font-size="9">Returns: New array (filtered) | Original: Unchanged | Use: Select data</text>
  </g>

  <!-- REDUCE -->
  <g filter="url(#shadow)">
    <rect x="25" y="180" width="395" height="100" rx="10" fill="#0a192f" stroke="#f59e0b" stroke-width="2"/>
    <text x="40" y="203" fill="#fbbf24" font-size="12" font-weight="700">.reduce()</text>
    <text x="120" y="203" fill="#8892b0" font-size="10">— Accumulate into a single value</text>
    
    <!-- Input -->
    <rect x="40" y="213" width="30" height="25" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="55" y="230" text-anchor="middle" fill="#fde68a" font-size="10">1</text>
    <rect x="75" y="213" width="30" height="25" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="90" y="230" text-anchor="middle" fill="#fde68a" font-size="10">2</text>
    <rect x="110" y="213" width="30" height="25" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="125" y="230" text-anchor="middle" fill="#fde68a" font-size="10">3</text>
    <rect x="145" y="213" width="30" height="25" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="160" y="230" text-anchor="middle" fill="#fde68a" font-size="10">4</text>
    
    <text x="188" y="230" fill="#f59e0b" font-size="12">→</text>
    <text x="205" y="230" fill="#e2e8f0" font-size="9">(acc + x)</text>
    <text x="265" y="230" fill="#f59e0b" font-size="12">→</text>
    
    <!-- Output: single value -->
    <rect x="285" y="213" width="50" height="25" rx="12" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <text x="310" y="230" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">10</text>
    
    <text x="40" y="265" fill="#94a3b8" font-size="9">Returns: Single value (any type!) | Use: Sum, count, group, flatten</text>
  </g>

  <!-- FIND -->
  <g filter="url(#shadow)">
    <rect x="430" y="180" width="395" height="100" rx="10" fill="#0a192f" stroke="#ec4899" stroke-width="2"/>
    <text x="445" y="203" fill="#f472b6" font-size="12" font-weight="700">.find()</text>
    <text x="510" y="203" fill="#8892b0" font-size="10">— First item matching condition (or undefined)</text>
    
    <!-- Input -->
    <rect x="445" y="213" width="30" height="25" rx="4" fill="#1a1a2e" stroke="#6b7280" stroke-width="1"/>
    <text x="460" y="230" text-anchor="middle" fill="#9ca3af" font-size="10">1</text>
    <rect x="480" y="213" width="30" height="25" rx="4" fill="#1a1a2e" stroke="#6b7280" stroke-width="1"/>
    <text x="495" y="230" text-anchor="middle" fill="#9ca3af" font-size="10">3</text>
    <rect x="515" y="213" width="30" height="25" rx="4" fill="#500724" stroke="#ec4899" stroke-width="2"/>
    <text x="530" y="230" text-anchor="middle" fill="#f9a8d4" font-size="10" font-weight="700">5</text>
    <rect x="550" y="213" width="30" height="25" rx="4" fill="#1a1a2e" stroke="#6b7280" stroke-width="1"/>
    <text x="565" y="230" text-anchor="middle" fill="#9ca3af" font-size="10">7</text>
    <rect x="585" y="213" width="30" height="25" rx="4" fill="#1a1a2e" stroke="#6b7280" stroke-width="1"/>
    <text x="600" y="230" text-anchor="middle" fill="#9ca3af" font-size="10">9</text>
    
    <text x="628" y="230" fill="#ec4899" font-size="12">→</text>
    <text x="645" y="230" fill="#e2e8f0" font-size="9">x &gt; 4</text>
    <text x="680" y="230" fill="#ec4899" font-size="12">→</text>
    
    <rect x="700" y="213" width="35" height="25" rx="12" fill="#831843" stroke="#f472b6" stroke-width="2"/>
    <text x="717" y="230" text-anchor="middle" fill="#f9a8d4" font-size="11" font-weight="700">5</text>
    <text x="743" y="230" fill="#f472b6" font-size="9">first!</text>
    
    <text x="445" y="265" fill="#94a3b8" font-size="9">Returns: First match (element) or undefined | Stops at first match</text>
  </g>

  <!-- forEach -->
  <g filter="url(#shadow)">
    <rect x="25" y="295" width="395" height="100" rx="10" fill="#0a192f" stroke="#06b6d4" stroke-width="2"/>
    <text x="40" y="318" fill="#22d3ee" font-size="12" font-weight="700">.forEach()</text>
    <text x="125" y="318" fill="#8892b0" font-size="10">— Execute function on each element (no return)</text>
    
    <rect x="40" y="328" width="30" height="25" rx="4" fill="#083344" stroke="#06b6d4" stroke-width="1"/>
    <text x="55" y="345" text-anchor="middle" fill="#67e8f9" font-size="10">🍎</text>
    <rect x="75" y="328" width="30" height="25" rx="4" fill="#083344" stroke="#06b6d4" stroke-width="1"/>
    <text x="90" y="345" text-anchor="middle" fill="#67e8f9" font-size="10">🍌</text>
    <rect x="110" y="328" width="30" height="25" rx="4" fill="#083344" stroke="#06b6d4" stroke-width="1"/>
    <text x="125" y="345" text-anchor="middle" fill="#67e8f9" font-size="10">🍇</text>
    
    <text x="155" y="345" fill="#06b6d4" font-size="12">→</text>
    <text x="170" y="345" fill="#e2e8f0" font-size="9">console.log(x)</text>
    <text x="280" y="345" fill="#06b6d4" font-size="12">→</text>
    <text x="300" y="345" fill="#ef4444" font-size="10" font-weight="600">undefined</text>
    
    <text x="40" y="380" fill="#94a3b8" font-size="9">Returns: undefined! | Side effects only | Can't break/return | Use: logging, DOM updates</text>
  </g>

  <!-- some/every -->
  <g filter="url(#shadow)">
    <rect x="430" y="295" width="395" height="100" rx="10" fill="#0a192f" stroke="#84cc16" stroke-width="2"/>
    <text x="445" y="318" fill="#a3e635" font-size="12" font-weight="700">.some() / .every()</text>
    <text x="580" y="318" fill="#8892b0" font-size="10">— Boolean check on array</text>
    
    <text x="445" y="345" fill="#a3e635" font-size="10">.some(x =&gt; x &gt; 3)</text>
    <text x="600" y="345" fill="#e2e8f0" font-size="10">→ true</text>
    <text x="660" y="345" fill="#94a3b8" font-size="9">(at least one)</text>
    
    <text x="445" y="370" fill="#a3e635" font-size="10">.every(x =&gt; x &gt; 0)</text>
    <text x="600" y="370" fill="#e2e8f0" font-size="10">→ true</text>
    <text x="660" y="370" fill="#94a3b8" font-size="9">(all must pass)</text>
    
    <text x="445" y="390" fill="#94a3b8" font-size="9">Returns: boolean | Short-circuits on first result</text>
  </g>

  <!-- Quick Reference Table -->
  <g filter="url(#shadow)">
    <rect x="25" y="410" width="800" height="95" rx="10" fill="#0a192f" stroke="#475569" stroke-width="1.5"/>
    <text x="425" y="432" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">📋 Quick Reference</text>
    
    <text x="45" y="452" fill="#a78bfa" font-size="9">.map() → New array (transformed)</text>
    <text x="250" y="452" fill="#34d399" font-size="9">.filter() → New array (subset)</text>
    <text x="460" y="452" fill="#fbbf24" font-size="9">.reduce() → Single value</text>
    <text x="660" y="452" fill="#f472b6" font-size="9">.find() → Single element</text>
    
    <text x="45" y="472" fill="#22d3ee" font-size="9">.forEach() → undefined (side-effects)</text>
    <text x="250" y="472" fill="#a3e635" font-size="9">.some() → boolean (any)</text>
    <text x="460" y="472" fill="#a3e635" font-size="9">.every() → boolean (all)</text>
    <text x="660" y="472" fill="#f87171" font-size="9">.findIndex() → index (-1 if none)</text>
    
    <text x="45" y="495" fill="#94a3b8" font-size="9">💡 map/filter/reduce = Most used trio | They DON'T mutate original array | Chain them: arr.filter().map().reduce()</text>
  </g>
</svg>