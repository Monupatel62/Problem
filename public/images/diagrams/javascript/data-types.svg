<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="14"/>
  
  <text x="400" y="33" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">📦 JavaScript Data Types</text>
  <text x="400" y="50" text-anchor="middle" fill="#8892b0" font-size="11">Primitive (Stack) vs Reference (Heap) — 8 total types</text>

  <!-- Primitive Types -->
  <g filter="url(#shadow)">
    <rect x="25" y="65" width="450" height="280" rx="12" fill="#0a192f" stroke="#3b82f6" stroke-width="2"/>
    <rect x="25" y="65" width="450" height="30" rx="12" fill="#1d4ed8"/>
    <text x="250" y="84" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">🧊 PRIMITIVE TYPES (7) — Immutable, Stored in Stack</text>
    
    <!-- String -->
    <rect x="45" y="105" width="200" height="35" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="55" y="127" fill="#22d3ee" font-size="11" font-weight="600">String</text>
    <text x="110" y="127" fill="#94a3b8" font-size="10">"Hello World"</text>
    
    <!-- Number -->
    <rect x="255" y="105" width="200" height="35" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="265" y="127" fill="#a78bfa" font-size="11" font-weight="600">Number</text>
    <text x="330" y="127" fill="#94a3b8" font-size="10">42, 3.14, NaN, Infinity</text>
    
    <!-- Boolean -->
    <rect x="45" y="150" width="200" height="35" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="55" y="172" fill="#34d399" font-size="11" font-weight="600">Boolean</text>
    <text x="120" y="172" fill="#94a3b8" font-size="10">true / false</text>
    
    <!-- undefined -->
    <rect x="255" y="150" width="200" height="35" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="265" y="172" fill="#fbbf24" font-size="11" font-weight="600">undefined</text>
    <text x="345" y="172" fill="#94a3b8" font-size="10">not assigned</text>
    
    <!-- null -->
    <rect x="45" y="195" width="200" height="35" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="55" y="217" fill="#f472b6" font-size="11" font-weight="600">null</text>
    <text x="90" y="217" fill="#94a3b8" font-size="10">intentional empty</text>
    
    <!-- Symbol -->
    <rect x="255" y="195" width="200" height="35" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="265" y="217" fill="#f59e0b" font-size="11" font-weight="600">Symbol</text>
    <text x="320" y="217" fill="#94a3b8" font-size="10">Symbol("id") unique</text>
    
    <!-- BigInt -->
    <rect x="45" y="240" width="200" height="35" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="55" y="262" fill="#ef4444" font-size="11" font-weight="600">BigInt</text>
    <text x="110" y="262" fill="#94a3b8" font-size="10">123n (large numbers)</text>
    
    <!-- Key features -->
    <rect x="45" y="290" width="410" height="45" rx="8" fill="#172554" stroke="#1e40af" stroke-width="1"/>
    <text x="250" y="308" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Key Features:</text>
    <text x="250" y="326" text-anchor="middle" fill="#94a3b8" font-size="9">✓ Immutable | ✓ Compared by VALUE | ✓ Stored on STACK | ✓ typeof works</text>
  </g>

  <!-- Reference Types -->
  <g filter="url(#shadow)">
    <rect x="495" y="65" width="280" height="280" rx="12" fill="#0a192f" stroke="#f59e0b" stroke-width="2"/>
    <rect x="495" y="65" width="280" height="30" rx="12" fill="#92400e"/>
    <text x="635" y="84" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">📎 REFERENCE (Heap)</text>
    
    <!-- Object -->
    <rect x="515" y="105" width="240" height="35" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="525" y="127" fill="#fbbf24" font-size="11" font-weight="600">Object</text>
    <text x="580" y="127" fill="#94a3b8" font-size="10">{ key: value }</text>
    
    <!-- Array -->
    <rect x="515" y="150" width="240" height="35" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="525" y="172" fill="#fbbf24" font-size="11" font-weight="600">Array</text>
    <text x="575" y="172" fill="#94a3b8" font-size="10">[1, 2, 3]</text>
    
    <!-- Function -->
    <rect x="515" y="195" width="240" height="35" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="525" y="217" fill="#fbbf24" font-size="11" font-weight="600">Function</text>
    <text x="595" y="217" fill="#94a3b8" font-size="10">() =&gt; {}</text>
    
    <!-- Date, RegExp, etc -->
    <rect x="515" y="240" width="240" height="35" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="525" y="262" fill="#fbbf24" font-size="11" font-weight="600">Date, RegExp, Map, Set...</text>
    
    <!-- Key features -->
    <rect x="515" y="290" width="240" height="45" rx="8" fill="#451a03" stroke="#78350f" stroke-width="1"/>
    <text x="635" y="308" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Key Features:</text>
    <text x="635" y="326" text-anchor="middle" fill="#94a3b8" font-size="9">✓ Mutable | ✓ By REFERENCE | ✓ On HEAP</text>
  </g>

  <!-- Bottom comparison -->
  <g filter="url(#shadow)">
    <rect x="25" y="360" width="750" height="75" rx="12" fill="#0a192f" stroke="#475569" stroke-width="1.5"/>
    <text x="400" y="382" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">⚡ Copy Behavior Difference</text>
    
    <text x="45" y="403" fill="#3b82f6" font-size="10">Primitive: let b = a; → b gets COPY</text>
    <text x="45" y="420" fill="#94a3b8" font-size="9">Changing b doesn't affect a</text>
    
    <text x="400" y="403" fill="#f59e0b" font-size="10">Reference: let b = a; → b gets SAME reference</text>
    <text x="400" y="420" fill="#94a3b8" font-size="9">Changing b.prop ALSO changes a.prop! (same object)</text>
  </g>
</svg>