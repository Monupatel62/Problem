<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027"/>
      <stop offset="50%" style="stop-color:#203a43"/>
      <stop offset="100%" style="stop-color:#2c5364"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#bg)" rx="14"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">🔭 JavaScript Scope &amp; Scope Chain</text>
  <text x="400" y="53" text-anchor="middle" fill="#8892b0" font-size="11">Where variables are accessible — Lexical (static) scoping</text>

  <!-- Global Scope (outermost) -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="740" height="430" rx="16" fill="rgba(100,255,218,0.03)" stroke="#64ffda" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="60" y="95" fill="#64ffda" font-size="13" font-weight="600">🌍 GLOBAL SCOPE</text>
    <text x="60" y="115" fill="#8892b0" font-size="10">var globalVar = "I'm global";</text>
    <text x="60" y="132" fill="#8892b0" font-size="10">const API_URL = "https://api.example.com";</text>
    
    <!-- Function Scope -->
    <g>
      <rect x="55" y="145" width="690" height="335" rx="14" fill="rgba(187,134,252,0.05)" stroke="#bb86fc" stroke-width="2" stroke-dasharray="6 3"/>
      <text x="80" y="170" fill="#bb86fc" font-size="12" font-weight="600">🔧 FUNCTION SCOPE — function outer()</text>
      <text x="80" y="190" fill="#8892b0" font-size="10">let outerVar = "I'm in outer";</text>
      <text x="80" y="207" fill="#8892b0" font-size="10">const outerConst = 42;</text>
      
      <!-- Inner function scope -->
      <g>
        <rect x="80" y="218" width="640" height="245" rx="12" fill="rgba(130,177,255,0.05)" stroke="#82b1ff" stroke-width="2" stroke-dasharray="5 3"/>
        <text x="105" y="243" fill="#82b1ff" font-size="12" font-weight="600">⚙️ FUNCTION SCOPE — function inner()</text>
        <text x="105" y="263" fill="#8892b0" font-size="10">let innerVar = "I'm in inner";</text>
        
        <!-- Block scope -->
        <g>
          <rect x="105" y="278" width="590" height="168" rx="10" fill="rgba(254,202,87,0.05)" stroke="#feca57" stroke-width="2" stroke-dasharray="4 3"/>
          <text x="125" y="300" fill="#feca57" font-size="11" font-weight="600">📦 BLOCK SCOPE — if (true) { }</text>
          <text x="125" y="320" fill="#8892b0" font-size="10">let blockVar = "I'm block-scoped";</text>
          <text x="125" y="337" fill="#8892b0" font-size="10">const blockConst = "Also block-scoped";</text>
          <text x="125" y="354" fill="#ff7979" font-size="10">var leakyVar = "I leak out! (function scope)";</text>
          
          <!-- Access demonstration -->
          <rect x="125" y="368" width="555" height="65" rx="8" fill="#0a192f" stroke="#475569" stroke-width="1"/>
          <text x="140" y="388" fill="#ccd6f6" font-size="10" font-weight="600">✅ Can access (looking UP the chain):</text>
          <text x="140" y="406" fill="#64ffda" font-size="10">blockVar ✓ | innerVar ✓ | outerVar ✓ | globalVar ✓</text>
          <text x="140" y="424" fill="#ff7979" font-size="10">❌ Outer scopes CANNOT access inner: blockVar from global = ReferenceError</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Scope Chain Arrow (right side) -->
  <g>
    <rect x="590" y="78" width="170" height="130" rx="10" fill="#0a192f" stroke="#475569" stroke-width="1.5"/>
    <text x="675" y="100" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">🔗 Scope Chain</text>
    <text x="675" y="118" text-anchor="middle" fill="#feca57" font-size="10">Block</text>
    <text x="675" y="133" text-anchor="middle" fill="#feca57" font-size="14">↓</text>
    <text x="675" y="148" text-anchor="middle" fill="#82b1ff" font-size="10">Function (inner)</text>
    <text x="675" y="163" text-anchor="middle" fill="#82b1ff" font-size="14">↓</text>
    <text x="675" y="178" text-anchor="middle" fill="#bb86fc" font-size="10">Function (outer)</text>
    <text x="675" y="193" text-anchor="middle" fill="#bb86fc" font-size="14">↓</text>
    <text x="675" y="206" text-anchor="middle" fill="#64ffda" font-size="10">Global</text>
  </g>

  <!-- Key concepts -->
  <text x="400" y="510" text-anchor="middle" fill="#4a5568" font-size="9">let/const = block-scoped | var = function-scoped | Lookup goes UP (inner → outer) never DOWN</text>
</svg>