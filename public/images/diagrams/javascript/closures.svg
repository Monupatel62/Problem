<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0025"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" rx="14"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">🔒 JavaScript Closures</text>
  <text x="400" y="53" text-anchor="middle" fill="#8892b0" font-size="11">A function that remembers its outer scope even after the outer function has returned</text>

  <!-- Code example (left) -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="350" height="250" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <rect x="30" y="70" width="350" height="28" rx="12" fill="#21262d"/>
    <circle cx="50" cy="84" r="5" fill="#ff5f56"/>
    <circle cx="68" cy="84" r="5" fill="#ffbd2e"/>
    <circle cx="86" cy="84" r="5" fill="#27c93f"/>
    <text x="200" y="88" text-anchor="middle" fill="#8b949e" font-size="9">closure-example.js</text>
    
    <text x="50" y="118" fill="#ff7b72" font-size="11">function</text>
    <text x="100" y="118" fill="#d2a8ff" font-size="11">createCounter</text>
    <text x="195" y="118" fill="#c9d1d9" font-size="11">() {</text>
    
    <text x="70" y="140" fill="#ff7b72" font-size="11">let</text>
    <text x="93" y="140" fill="#79c0ff" font-size="11">count</text>
    <text x="130" y="140" fill="#c9d1d9" font-size="11">= 0;</text>
    <text x="200" y="140" fill="#8b949e" font-size="10">// ← enclosed variable</text>
    
    <text x="70" y="168" fill="#ff7b72" font-size="11">return function</text>
    <text x="172" y="168" fill="#c9d1d9" font-size="11">() {</text>
    <text x="90" y="190" fill="#79c0ff" font-size="11">count</text>
    <text x="125" y="190" fill="#c9d1d9" font-size="11">++;</text>
    <text x="90" y="212" fill="#ff7b72" font-size="11">return</text>
    <text x="130" y="212" fill="#79c0ff" font-size="11">count</text>
    <text x="165" y="212" fill="#c9d1d9" font-size="11">;</text>
    <text x="70" y="234" fill="#c9d1d9" font-size="11">};</text>
    <text x="50" y="256" fill="#c9d1d9" font-size="11">}</text>
    
    <text x="50" y="284" fill="#ff7b72" font-size="11">const</text>
    <text x="85" y="284" fill="#79c0ff" font-size="11">increment</text>
    <text x="145" y="284" fill="#c9d1d9" font-size="11">=</text>
    <text x="155" y="284" fill="#d2a8ff" font-size="11">createCounter</text>
    <text x="250" y="284" fill="#c9d1d9" font-size="11">();</text>
    
    <text x="50" y="306" fill="#79c0ff" font-size="11">increment</text>
    <text x="110" y="306" fill="#c9d1d9" font-size="11">();</text>
    <text x="140" y="306" fill="#8b949e" font-size="10">// → 1</text>
    <text x="50" y="322" fill="#79c0ff" font-size="11">increment</text>
    <text x="110" y="322" fill="#c9d1d9" font-size="11">();</text>
    <text x="140" y="322" fill="#8b949e" font-size="10">// → 2</text>
  </g>

  <!-- Visual explanation (right) -->
  <g filter="url(#shadow)">
    <rect x="410" y="70" width="360" height="250" rx="12" fill="#0a192f" stroke="#a855f7" stroke-width="2"/>
    <text x="590" y="98" text-anchor="middle" fill="#a855f7" font-size="13" font-weight="600">🧠 How Closure Works</text>
    
    <!-- Outer function scope (dead but remembered) -->
    <rect x="430" y="110" width="320" height="80" rx="10" fill="rgba(168,85,247,0.1)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="450" y="130" fill="#a855f7" font-size="10" font-weight="600">createCounter() — Already returned! 👻</text>
    <rect x="450" y="140" width="120" height="35" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1"/>
    <text x="510" y="162" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">count: 0 → 1 → 2</text>
    <text x="580" y="162" fill="#8892b0" font-size="9">← still alive!</text>
    
    <!-- Inner function (the closure) -->
    <rect x="430" y="200" width="320" height="55" rx="10" fill="rgba(100,255,218,0.05)" stroke="#64ffda" stroke-width="1.5"/>
    <text x="450" y="222" fill="#64ffda" font-size="10" font-weight="600">increment() — The closure (returned fn)</text>
    <text x="450" y="240" fill="#8892b0" font-size="10">Has access to `count` via closure scope!</text>
    
    <!-- Arrow -->
    <path d="M510 200 L510 175" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="520" y="190" fill="#fbbf24" font-size="9">remembers ↑</text>
    
    <!-- Key insight -->
    <rect x="430" y="265" width="320" height="45" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="590" y="285" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">💡 Key Insight</text>
    <text x="590" y="302" text-anchor="middle" fill="#e2e8f0" font-size="10">Inner fn "closes over" outer variables = Closure!</text>
  </g>

  <!-- Use Cases -->
  <g filter="url(#shadow)">
    <rect x="30" y="340" width="350" height="140" rx="12" fill="#0a192f" stroke="#43e97b" stroke-width="2"/>
    <rect x="30" y="340" width="350" height="28" rx="12" fill="#43e97b"/>
    <text x="205" y="358" text-anchor="middle" fill="#0a192f" font-size="11" font-weight="600">✅ Common Use Cases</text>
    
    <text x="50" y="386" fill="#43e97b" font-size="10">🔢 Counters / State management</text>
    <text x="50" y="406" fill="#43e97b" font-size="10">🔒 Data privacy (encapsulation)</text>
    <text x="50" y="426" fill="#43e97b" font-size="10">🏭 Factory functions</text>
    <text x="50" y="446" fill="#43e97b" font-size="10">⏱️ setTimeout with loop variables</text>
    <text x="50" y="466" fill="#43e97b" font-size="10">🎯 Event handlers with state</text>
  </g>

  <!-- Common Mistakes -->
  <g filter="url(#shadow)">
    <rect x="410" y="340" width="360" height="140" rx="12" fill="#0a192f" stroke="#ff6b6b" stroke-width="2"/>
    <rect x="410" y="340" width="360" height="28" rx="12" fill="#ff6b6b"/>
    <text x="590" y="358" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">⚠️ Common Mistakes</text>
    
    <text x="430" y="386" fill="#ff6b6b" font-size="10">❌ Loop + var + closure = same value</text>
    <text x="430" y="406" fill="#64ffda" font-size="10">✅ Fix: use let (block-scoped) or IIFE</text>
    <text x="430" y="430" fill="#ff6b6b" font-size="10">❌ Memory leaks (unused closures holding refs)</text>
    <text x="430" y="450" fill="#64ffda" font-size="10">✅ Fix: null out references when done</text>
    <text x="430" y="474" fill="#feca57" font-size="10">💡 Closures are NOT copies — they reference!</text>
  </g>
</svg>