<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="420" fill="url(#bg)" rx="14"/>
  
  <text x="400" y="33" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">📦 JavaScript Module Systems</text>
  <text x="400" y="50" text-anchor="middle" fill="#8892b0" font-size="11">ES Modules vs CommonJS — How code is organized and shared</text>

  <!-- ES Modules (Modern) -->
  <g filter="url(#shadow)">
    <rect x="25" y="65" width="365" height="330" rx="12" fill="#0a192f" stroke="#10b981" stroke-width="2"/>
    <rect x="25" y="65" width="365" height="30" rx="12" fill="#065f46"/>
    <text x="207" y="84" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">✅ ES Modules (ESM) — The Standard</text>
    
    <text x="40" y="115" fill="#34d399" font-size="11" font-weight="600">Export:</text>
    <text x="40" y="135" fill="#94a3b8" font-size="10">export const name = "JS";</text>
    <text x="40" y="153" fill="#94a3b8" font-size="10">export default function() {}</text>
    <text x="40" y="171" fill="#94a3b8" font-size="10">export { fn1, fn2 };</text>
    
    <text x="40" y="200" fill="#34d399" font-size="11" font-weight="600">Import:</text>
    <text x="40" y="220" fill="#94a3b8" font-size="10">import { name } from './module.js';</text>
    <text x="40" y="238" fill="#94a3b8" font-size="10">import MyDefault from './module.js';</text>
    <text x="40" y="256" fill="#94a3b8" font-size="10">import * as utils from './utils.js';</text>
    
    <rect x="40" y="272" width="335" height="105" rx="8" fill="#052e16" stroke="#166534" stroke-width="1"/>
    <text x="207" y="292" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">✓ Characteristics</text>
    <text x="55" y="312" fill="#6ee7b7" font-size="9">• Static analysis (imports at top)</text>
    <text x="55" y="328" fill="#6ee7b7" font-size="9">• Tree-shaking support (unused code removed)</text>
    <text x="55" y="344" fill="#6ee7b7" font-size="9">• Async loading (non-blocking)</text>
    <text x="55" y="360" fill="#6ee7b7" font-size="9">• Strict mode by default</text>
    <text x="55" y="376" fill="#6ee7b7" font-size="9">• Browser + Node.js (type: "module")</text>
  </g>

  <!-- CommonJS -->
  <g filter="url(#shadow)">
    <rect x="410" y="65" width="365" height="330" rx="12" fill="#0a192f" stroke="#f59e0b" stroke-width="2"/>
    <rect x="410" y="65" width="365" height="30" rx="12" fill="#78350f"/>
    <text x="592" y="84" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">📦 CommonJS (CJS) — Node.js Legacy</text>
    
    <text x="425" y="115" fill="#fbbf24" font-size="11" font-weight="600">Export:</text>
    <text x="425" y="135" fill="#94a3b8" font-size="10">module.exports = { fn1, fn2 };</text>
    <text x="425" y="153" fill="#94a3b8" font-size="10">module.exports = myFunction;</text>
    <text x="425" y="171" fill="#94a3b8" font-size="10">exports.name = "JS";</text>
    
    <text x="425" y="200" fill="#fbbf24" font-size="11" font-weight="600">Require:</text>
    <text x="425" y="220" fill="#94a3b8" font-size="10">const { fn1 } = require('./module');</text>
    <text x="425" y="238" fill="#94a3b8" font-size="10">const utils = require('./utils');</text>
    <text x="425" y="256" fill="#94a3b8" font-size="10">const fs = require('fs');</text>
    
    <rect x="425" y="272" width="335" height="105" rx="8" fill="#451a03" stroke="#78350f" stroke-width="1"/>
    <text x="592" y="292" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">⚠️ Characteristics</text>
    <text x="440" y="312" fill="#fde68a" font-size="9">• Dynamic (require anywhere)</text>
    <text x="440" y="328" fill="#fde68a" font-size="9">• No tree-shaking</text>
    <text x="440" y="344" fill="#fde68a" font-size="9">• Synchronous loading (blocking)</text>
    <text x="440" y="360" fill="#fde68a" font-size="9">• Non-strict by default</text>
    <text x="440" y="376" fill="#fde68a" font-size="9">• Node.js only (not browsers)</text>
  </g>

  <text x="400" y="412" text-anchor="middle" fill="#4a5568" font-size="9">🎯 Use ES Modules for new projects | CommonJS still widely used in existing Node.js code</text>
</svg>