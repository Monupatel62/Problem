<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg)" rx="14"/>
  
  <text x="400" y="33" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">📈 Big O Notation — Time Complexity</text>
  <text x="400" y="50" text-anchor="middle" fill="#8892b0" font-size="11">How algorithm performance scales with input size (n)</text>

  <!-- Graph area -->
  <g filter="url(#shadow)">
    <rect x="30" y="65" width="420" height="330" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Axes -->
    <line x1="80" y1="360" x2="420" y2="360" stroke="#475569" stroke-width="2"/>
    <line x1="80" y1="360" x2="80" y2="80" stroke="#475569" stroke-width="2"/>
    <text x="250" y="390" text-anchor="middle" fill="#94a3b8" font-size="10">Input Size (n) →</text>
    <text x="50" y="220" text-anchor="middle" fill="#94a3b8" font-size="10" transform="rotate(-90, 50, 220)">Operations →</text>
    
    <!-- O(1) - Constant - Green -->
    <line x1="80" y1="340" x2="410" y2="340" stroke="#10b981" stroke-width="3"/>
    <text x="415" y="344" fill="#10b981" font-size="9">O(1)</text>
    
    <!-- O(log n) - Logarithmic - Cyan -->
    <path d="M80 340 Q150 300 200 270 Q280 240 350 225 Q380 218 410 212" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
    <text x="415" y="216" fill="#06b6d4" font-size="9">O(log n)</text>
    
    <!-- O(n) - Linear - Blue -->
    <line x1="80" y1="340" x2="410" y2="145" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="415" y="149" fill="#3b82f6" font-size="9">O(n)</text>
    
    <!-- O(n log n) - Linearithmic - Yellow -->
    <path d="M80 340 Q150 290 220 230 Q300 170 370 120 L410 100" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="415" y="104" fill="#f59e0b" font-size="9">O(n log n)</text>
    
    <!-- O(n²) - Quadratic - Orange -->
    <path d="M80 340 Q130 330 170 300 Q220 255 270 190 Q310 130 340 95" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <text x="345" y="90" fill="#f97316" font-size="9">O(n²)</text>
    
    <!-- O(2^n) - Exponential - Red -->
    <path d="M80 340 Q110 338 140 330 Q170 315 200 280 Q225 240 240 180 Q250 140 260 90" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <text x="265" y="85" fill="#ef4444" font-size="9">O(2ⁿ)</text>
  </g>

  <!-- Legend / Table -->
  <g filter="url(#shadow)">
    <rect x="470" y="65" width="305" height="330" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="622" y="90" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🏷️ Complexity Classes</text>
    
    <!-- Excellent -->
    <rect x="490" y="102" width="265" height="28" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <circle cx="505" cy="116" r="5" fill="#10b981"/>
    <text x="520" y="120" fill="#34d399" font-size="10" font-weight="600">O(1)</text>
    <text x="565" y="120" fill="#94a3b8" font-size="9">Constant — Hash lookup</text>
    
    <rect x="490" y="136" width="265" height="28" rx="5" fill="#083344" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="505" cy="150" r="5" fill="#06b6d4"/>
    <text x="520" y="154" fill="#22d3ee" font-size="10" font-weight="600">O(log n)</text>
    <text x="580" y="154" fill="#94a3b8" font-size="9">Logarithmic — Binary search</text>
    
    <!-- Good -->
    <rect x="490" y="170" width="265" height="28" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="505" cy="184" r="5" fill="#3b82f6"/>
    <text x="520" y="188" fill="#60a5fa" font-size="10" font-weight="600">O(n)</text>
    <text x="560" y="188" fill="#94a3b8" font-size="9">Linear — Loop through array</text>
    
    <!-- Fair -->
    <rect x="490" y="204" width="265" height="28" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="505" cy="218" r="5" fill="#f59e0b"/>
    <text x="520" y="222" fill="#fbbf24" font-size="10" font-weight="600">O(n log n)</text>
    <text x="595" y="222" fill="#94a3b8" font-size="9">Merge/Quick sort</text>
    
    <!-- Bad -->
    <rect x="490" y="238" width="265" height="28" rx="5" fill="#431407" stroke="#f97316" stroke-width="1"/>
    <circle cx="505" cy="252" r="5" fill="#f97316"/>
    <text x="520" y="256" fill="#fb923c" font-size="10" font-weight="600">O(n²)</text>
    <text x="565" y="256" fill="#94a3b8" font-size="9">Quadratic — Bubble sort</text>
    
    <!-- Terrible -->
    <rect x="490" y="272" width="265" height="28" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <circle cx="505" cy="286" r="5" fill="#ef4444"/>
    <text x="520" y="290" fill="#fca5a5" font-size="10" font-weight="600">O(2ⁿ)</text>
    <text x="565" y="290" fill="#94a3b8" font-size="9">Exponential — Recursive fib</text>
    
    <rect x="490" y="306" width="265" height="28" rx="5" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <circle cx="505" cy="320" r="5" fill="#dc2626"/>
    <text x="520" y="324" fill="#fca5a5" font-size="10" font-weight="600">O(n!)</text>
    <text x="560" y="324" fill="#94a3b8" font-size="9">Factorial — Permutations</text>
    
    <!-- Rating scale -->
    <rect x="490" y="345" width="265" height="38" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="500" y="362" fill="#10b981" font-size="9">Excellent</text>
    <text x="560" y="362" fill="#3b82f6" font-size="9">Good</text>
    <text x="600" y="362" fill="#f59e0b" font-size="9">Fair</text>
    <text x="635" y="362" fill="#f97316" font-size="9">Bad</text>
    <text x="670" y="362" fill="#ef4444" font-size="9">Horrible</text>
    <text x="622" y="378" text-anchor="middle" fill="#64748b" font-size="8">← Better                    Worse →</text>
  </g>

  <!-- Common operations -->
  <g filter="url(#shadow)">
    <rect x="30" y="408" width="745" height="55" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="400" y="428" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="600">⚡ Common Operations Complexity</text>
    <text x="50" y="448" fill="#10b981" font-size="9">Array access: O(1)</text>
    <text x="180" y="448" fill="#3b82f6" font-size="9">Array search: O(n)</text>
    <text x="320" y="448" fill="#06b6d4" font-size="9">Binary search: O(log n)</text>
    <text x="490" y="448" fill="#f59e0b" font-size="9">Sorting: O(n log n)</text>
    <text x="630" y="448" fill="#f97316" font-size="9">Nested loops: O(n²)</text>
  </g>
</svg>