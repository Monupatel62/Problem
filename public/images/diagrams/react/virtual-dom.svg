<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="850" height="420" fill="url(#bg)" rx="14"/>
  
  <text x="425" y="33" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">⚛️ Virtual DOM &amp; Reconciliation</text>
  <text x="425" y="50" text-anchor="middle" fill="#8892b0" font-size="11">How React efficiently updates the real DOM using a virtual copy</text>

  <!-- Step 1: State Change -->
  <g filter="url(#shadow)">
    <rect x="25" y="70" width="180" height="80" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="115" y="95" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">1️⃣ State Changes</text>
    <text x="115" y="115" text-anchor="middle" fill="#94a3b8" font-size="9">setState() called</text>
    <text x="115" y="132" text-anchor="middle" fill="#94a3b8" font-size="9">or props update</text>
  </g>

  <!-- Arrow -->
  <path d="M205 110 L230 110" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="227,105 237,110 227,115" fill="#475569"/>

  <!-- Step 2: New Virtual DOM -->
  <g filter="url(#shadow)">
    <rect x="240" y="70" width="180" height="80" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <text x="330" y="95" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">2️⃣ New V-DOM Tree</text>
    <text x="330" y="115" text-anchor="middle" fill="#94a3b8" font-size="9">React creates a NEW</text>
    <text x="330" y="132" text-anchor="middle" fill="#94a3b8" font-size="9">Virtual DOM tree</text>
  </g>

  <!-- Arrow -->
  <path d="M420 110 L445 110" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="442,105 452,110 442,115" fill="#475569"/>

  <!-- Step 3: Diffing -->
  <g filter="url(#shadow)">
    <rect x="455" y="70" width="180" height="80" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
    <text x="545" y="95" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">3️⃣ DIFFING</text>
    <text x="545" y="115" text-anchor="middle" fill="#94a3b8" font-size="9">Compare Old V-DOM</text>
    <text x="545" y="132" text-anchor="middle" fill="#94a3b8" font-size="9">vs New V-DOM</text>
  </g>

  <!-- Arrow -->
  <path d="M635 110 L660 110" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="657,105 667,110 657,115" fill="#475569"/>

  <!-- Step 4: Patch Real DOM -->
  <g filter="url(#shadow)">
    <rect x="670" y="70" width="155" height="80" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="747" y="95" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">4️⃣ PATCH</text>
    <text x="747" y="115" text-anchor="middle" fill="#94a3b8" font-size="9">Update ONLY</text>
    <text x="747" y="132" text-anchor="middle" fill="#94a3b8" font-size="9">changed nodes</text>
  </g>

  <!-- Diffing Visualization -->
  <g filter="url(#shadow)">
    <rect x="25" y="170" width="380" height="230" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="215" y="195" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">Old Virtual DOM</text>
    
    <!-- Old tree -->
    <rect x="175" y="210" width="80" height="28" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
    <text x="215" y="228" text-anchor="middle" fill="#93c5fd" font-size="9">&lt;div&gt;</text>
    
    <line x1="195" y1="238" x2="140" y2="260" stroke="#3b82f6" stroke-width="1"/>
    <line x1="235" y1="238" x2="290" y2="260" stroke="#3b82f6" stroke-width="1"/>
    
    <rect x="100" y="260" width="80" height="28" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
    <text x="140" y="278" text-anchor="middle" fill="#93c5fd" font-size="9">&lt;h1&gt;</text>
    
    <rect x="250" y="260" width="80" height="28" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
    <text x="290" y="278" text-anchor="middle" fill="#93c5fd" font-size="9">&lt;p&gt;</text>
    
    <line x1="140" y1="288" x2="140" y2="306" stroke="#3b82f6" stroke-width="1"/>
    <rect x="100" y="306" width="80" height="24" rx="4" fill="#172554" stroke="#1e40af" stroke-width="1"/>
    <text x="140" y="322" text-anchor="middle" fill="#bfdbfe" font-size="8">"Hello"</text>
    
    <line x1="290" y1="288" x2="290" y2="306" stroke="#3b82f6" stroke-width="1"/>
    <rect x="250" y="306" width="80" height="24" rx="4" fill="#172554" stroke="#1e40af" stroke-width="1"/>
    <text x="290" y="322" text-anchor="middle" fill="#bfdbfe" font-size="8">"World"</text>
    
    <text x="215" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">count: 0</text>
    <text x="215" y="378" text-anchor="middle" fill="#94a3b8" font-size="9">class: "inactive"</text>
  </g>

  <!-- VS Arrow -->
  <text x="425" y="290" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="700">⇄</text>
  <text x="425" y="308" text-anchor="middle" fill="#fbbf24" font-size="10">DIFF</text>

  <!-- New Virtual DOM -->
  <g filter="url(#shadow)">
    <rect x="445" y="170" width="380" height="230" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="635" y="195" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">New Virtual DOM</text>
    
    <!-- New tree (with changes highlighted) -->
    <rect x="595" y="210" width="80" height="28" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
    <text x="635" y="228" text-anchor="middle" fill="#93c5fd" font-size="9">&lt;div&gt;</text>
    
    <line x1="615" y1="238" x2="560" y2="260" stroke="#3b82f6" stroke-width="1"/>
    <line x1="655" y1="238" x2="710" y2="260" stroke="#3b82f6" stroke-width="1"/>
    
    <rect x="520" y="260" width="80" height="28" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
    <text x="560" y="278" text-anchor="middle" fill="#93c5fd" font-size="9">&lt;h1&gt;</text>
    
    <!-- Changed node highlighted -->
    <rect x="670" y="260" width="80" height="28" rx="5" fill="#052e16" stroke="#10b981" stroke-width="2"/>
    <text x="710" y="278" text-anchor="middle" fill="#34d399" font-size="9">&lt;p&gt; ✓</text>
    
    <line x1="560" y1="288" x2="560" y2="306" stroke="#3b82f6" stroke-width="1"/>
    <rect x="520" y="306" width="80" height="24" rx="4" fill="#172554" stroke="#1e40af" stroke-width="1"/>
    <text x="560" y="322" text-anchor="middle" fill="#bfdbfe" font-size="8">"Hello"</text>
    
    <line x1="710" y1="288" x2="710" y2="306" stroke="#10b981" stroke-width="2"/>
    <rect x="670" y="306" width="80" height="24" rx="4" fill="#052e16" stroke="#10b981" stroke-width="2"/>
    <text x="710" y="322" text-anchor="middle" fill="#34d399" font-size="8" font-weight="700">"Updated!"</text>
    
    <text x="635" y="360" text-anchor="middle" fill="#34d399" font-size="9" font-weight="600">count: 1 ← changed!</text>
    <text x="635" y="378" text-anchor="middle" fill="#34d399" font-size="9" font-weight="600">class: "active" ← changed!</text>
  </g>

  <!-- Footer -->
  <text x="425" y="413" text-anchor="middle" fill="#4a5568" font-size="9">Only the green nodes get updated in the real DOM — React batches changes for performance (Fiber architecture)</text>
</svg>